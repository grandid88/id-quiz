<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I&D Quiz — Écran</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<style>
  html, body { width:100%; height:100%; overflow:hidden; }

  .screen-wrap {
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 60px;
    position:relative;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(201,168,76,0.1), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(61,107,79,0.1), transparent 50%),
      var(--ivory-main);
  }

  .s-screen { width:100%; }

  /* ── Écran d'attente ──────────────────────────────────── */
  #s-wait { text-align:center; }
  .wait-big-icon { font-size:100px; animation:float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .wait-big-title {
    font-family: var(--script-font);
    font-size: 80px;
    color: var(--forest-dark);
    text-shadow: 0 4px 24px rgba(61,107,79,0.15);
    margin: 16px 0 12px;
  }
  .wait-big-sub { font-family:var(--display-font); font-size:24px; color:rgba(43,38,32,0.6); }

  /* ── Écran classement ─────────────────────────────────── */
  #s-leaderboard { text-align:center; }
  .lb-title {
    font-family: var(--script-font);
    font-size: 64px;
    color: var(--forest-dark);
    margin-bottom: 8px;
  }
  .lb-sub {
    font-size: 18px;
    color: rgba(43,38,32,0.55);
    margin-bottom: 32px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .lb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
    max-width: 900px;
    margin: 0 auto;
    max-height: 70vh;
    overflow-y: auto;
    padding: 4px;
  }

  .rank-item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--ivory-soft);
    border: 1px solid rgba(61,107,79,0.1);
    border-radius: 16px;
    padding: 14px 20px;
    box-shadow: var(--shadow-card);
    animation: slideIn 0.4s ease both;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }

  .rank-item.rank-top-1 { border-color:var(--gold); background:rgba(201,168,76,0.1); transform:scale(1.02); }
  .rank-item.rank-top-2 { border-color:rgba(192,192,192,0.5); }
  .rank-item.rank-top-3 { border-color:rgba(205,127,50,0.4); }

  .rank-pos  { font-size:28px; flex-shrink:0; }
  .rank-name { font-size:20px; font-weight:700; color:var(--ink); flex:1; }
  .rank-table{ font-size:13px; color:var(--forest); opacity:0.8; }
  .rank-score{ font-size:24px; font-weight:800; color:var(--gold); }
  .rank-score small { font-size:13px; font-weight:400; color:rgba(43,38,32,0.5); }
</style>
</head>
<body>
<div class="screen-wrap">

  <!-- ATTENTE -->
  <div id="s-wait" class="s-screen">
    <div class="wait-big-icon">🎯</div>
    <div class="wait-big-title">I&D Quiz</div>
    <p class="wait-big-sub">Isabelle &amp; Didier · 26 juin 2027</p>
  </div>

  <!-- CLASSEMENT FINAL -->
  <div id="s-leaderboard" class="s-screen hidden">
    <div class="lb-title">Classement final</div>
    <p class="lb-sub">I&D Quiz · Mission Paradis</p>
    <div class="lb-grid" id="se-leaderboard"></div>
  </div>

</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/screen.js"></script>
</body>
</html>
