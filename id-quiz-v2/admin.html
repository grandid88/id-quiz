<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>I&D Quiz — Animateur</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .page { max-width: 540px; margin: 0 auto; padding: 32px 20px 80px; min-height: 100vh; }

  .pin-input {
    width: 100%; text-align: center;
    font-size: 36px; letter-spacing: 18px; padding: 16px;
    background: #fff; border: 1.5px solid rgba(61,107,79,0.2);
    border-radius: 14px; color: var(--forest-dark);
    margin-bottom: 16px;
  }
  .pin-input:focus { outline: none; border-color: var(--gold); }
  .pin-error { color: var(--terracotta); font-size: 13px; margin-top: 8px; text-align: center; }

  .players-count {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--forest);
    padding: 12px 20px;
    background: rgba(61,107,79,0.06);
    border: 1px solid rgba(61,107,79,0.15);
    border-radius: 14px;
    margin-bottom: 20px;
  }

  .action-card {
    background: var(--ivory-soft);
    border: 1px solid rgba(61,107,79,0.1);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-card);
  }
  .action-title {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--forest);
    font-weight: 700;
    margin-bottom: 12px;
  }

  .mini-rank-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.7);
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .mini-rank { font-size: 16px; flex-shrink: 0; }
  .mini-name { flex: 1; font-weight: 600; color: var(--ink); }
  .mini-score { font-weight: 800; color: var(--gold); }

  .btn-show { background: var(--forest); color: var(--ivory-soft); }
  .btn-show:hover { background: var(--forest-dark); }
  .btn-hide { background: transparent; color: var(--forest); border: 1.5px solid var(--forest); }
  .btn-danger { background: transparent; color: var(--terracotta); border: 1px solid var(--terracotta); font-size: 13px; }
  .btn-logout { background: transparent; color: rgba(43,38,32,0.4); border: 1px solid rgba(43,38,32,0.15); font-size: 12px; }
</style>
</head>
<body>
<div class="page">

  <!-- PIN -->
  <div id="pin-screen">
    <div class="page-header">
      <div class="page-eyebrow">Interface Animateur</div>
      <h1 class="page-title">I&D Quiz</h1>
    </div>
    <hr class="gold-rule">
    <div class="card" style="text-align:center">
      <p style="font-size:14px;color:rgba(43,38,32,0.6);margin-bottom:16px">Code d'accès animateur</p>
      <input type="password" id="pin-input" inputmode="numeric" maxlength="4" class="pin-input" placeholder="••••">
      <button class="btn btn-primary btn-block" id="btn-pin">Accéder</button>
      <div class="pin-error hidden" id="pin-error">Code incorrect, réessayez.</div>
    </div>
  </div>

  <!-- INTERFACE ANIMATEUR -->
  <div id="dj-screen" class="hidden">
    <div class="page-header">
      <div class="page-eyebrow">Interface Animateur · I&D Quiz</div>
      <h1 class="page-title" style="font-size:36px">Panneau</h1>
    </div>
    <hr class="gold-rule">

    <!-- Compteur joueurs -->
    <div class="players-count" id="players-count">0 joueur a terminé</div>

    <!-- Classement mini -->
    <div class="action-card">
      <div class="action-title">🏆 Classement en cours</div>
      <div id="mini-classement"></div>
    </div>

    <!-- Contrôle vidéoprojecteur -->
    <div class="action-card">
      <div class="action-title">📺 Vidéoprojecteur</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-show" id="btn-show-leaderboard" style="flex:1">
          🏆 Afficher le classement
        </button>
        <button class="btn btn-hide" id="btn-hide-leaderboard" style="flex:1">
          ↩ Masquer
        </button>
      </div>
    </div>

    <!-- Reset + logout -->
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-danger" id="btn-reset" style="flex:1">🔄 Réinitialiser</button>
      <button class="btn btn-logout" id="btn-logout" style="flex:1">Déconnexion</button>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
