<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>I&D Quiz</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<style>
  .page { max-width: 420px; margin: 0 auto; padding: 24px 16px 64px; min-height: 100vh; }
  @media (max-width: 380px) { .page { padding: 18px 12px 48px; } }

  /* ── Grille des tables ─────────────────────────────────── */
  .tables-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
    margin-top: 10px;
    width: 100%;
  }
  .table-option { min-width: 0; }
  .table-option input { display: none; }
  .table-option label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 2px;
    border-radius: 10px;
    border: 1.5px solid rgba(61,107,79,0.15);
    background: #fff;
    cursor: pointer;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: rgba(43,38,32,0.6);
    transition: all 0.2s;
    width: 100%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
  }
  .table-option label[for^="t-Nouv"] {
    white-space: normal;
    word-break: normal;
    overflow: visible;
  }
  .table-option label .t-emoji { font-size: 18px; }
  .table-option input:checked + label {
    border-color: var(--gold);
    background: rgba(201,168,76,0.1);
    color: var(--forest-dark);
    box-shadow: 0 2px 10px rgba(201,168,76,0.2);
  }

  /* ── Écran de jeu ──────────────────────────────────────── */
  #screen-game {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 32px;
    max-width: 420px;
    margin: 0 auto;
    overflow: hidden;
  }
  .game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .q-number {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--forest);
    font-weight: 600;
  }
  .timer-wrap { position: relative; width: 56px; height: 56px; }
  .timer-wrap svg { transform: rotate(-90deg); }
  .timer-track { fill: none; stroke: rgba(61,107,79,0.15); stroke-width: 4; }
  .timer-bar {
    fill: none; stroke: var(--gold); stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 138; stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear, stroke 0.5s;
  }
  .timer-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: var(--gold);
  }
  .q-text {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: var(--display-font);
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.45;
    padding: 12px 0;
    overflow: hidden;
  }
  .answer-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    flex-shrink: 0;
    margin-top: 8px;
  }
  .btn-vrai, .btn-faux {
    height: 80px;
    border-radius: 20px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.3s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .btn-vrai { background: linear-gradient(135deg,#2E7D32,#43A047); color:#fff; box-shadow:0 6px 20px rgba(46,125,50,.3); }
  .btn-faux { background: linear-gradient(135deg,#C62828,#E53935); color:#fff; box-shadow:0 6px 20px rgba(198,40,40,.3); }
  .btn-vrai:hover { transform: translateY(-3px); }
  .btn-faux:hover { transform: translateY(-3px); }
  .btn-icon { font-size: 28px; line-height: 1; }
  .btn-vrai.selected, .btn-faux.selected { transform: scale(1.05); filter: brightness(1.1); }
  .btn-vrai.dimmed, .btn-faux.dimmed { opacity: 0.3; pointer-events: none; }

  /* ── Écran résultat ────────────────────────────────────── */
  #screen-result {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px 24px 40px;
    max-width: 420px;
    margin: 0 auto;
    gap: 0;
  }

  /* Badge réponse correcte */
  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    border-radius: var(--radius-pill);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .badge-vrai { background: rgba(46,125,50,.12); color:#2E7D32; border: 1.5px solid rgba(46,125,50,.3); }
  .badge-faux { background: rgba(198,40,40,.12); color:#C62828; border: 1.5px solid rgba(198,40,40,.3); }

  .result-icon { font-size: 52px; margin-bottom: 8px; }
  .result-label { font-family: var(--display-font); font-size: 26px; font-weight: 700; margin-bottom: 14px; }

  /* Commentaire */
  .result-comment {
    font-family: var(--display-font);
    font-size: 16px;
    font-style: italic;
    color: var(--ink);
    line-height: 1.5;
    margin-bottom: 18px;
    padding: 12px 16px;
    background: rgba(61,107,79,0.05);
    border-radius: 12px;
    border-left: 3px solid var(--gold);
    text-align: left;
    width: 100%;
  }

  /* Points */
  .result-points { font-size: 44px; font-weight: 800; color: var(--gold); margin-bottom: 2px; }
  .result-pts-label { font-size: 12px; color: rgba(43,38,32,0.5); margin-bottom: 8px; }
  .result-total {
    font-size: 14px;
    font-weight: 600;
    color: var(--forest);
    padding: 8px 18px;
    border: 1px solid rgba(61,107,79,0.2);
    border-radius: var(--radius-pill);
    background: rgba(61,107,79,0.05);
    margin-bottom: 24px;
  }

  /* ── Fin de jeu ────────────────────────────────────────── */
  #screen-end {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
  }
  .end-icon { font-size: 64px; margin-bottom: 16px; }
  .end-title { font-family: var(--script-font); font-size: 48px; color: var(--forest-dark); margin-bottom: 8px; }
  .end-score-wrap {
    margin: 16px 0 24px;
    padding: 16px 32px;
    background: rgba(201,168,76,0.1);
    border: 1.5px solid var(--gold);
    border-radius: 18px;
  }
  .end-score { font-size: 56px; font-weight: 800; color: var(--gold); line-height: 1; }
  .end-score-label { font-size: 13px; color: rgba(43,38,32,0.55); margin-top: 4px; }
</style>
</head>
<body>

<!-- ENREGISTREMENT -->
<div id="screen-register">
  <div class="page">
    <div class="page-header">
      <div class="page-eyebrow">I&amp;D · 26 juin 2027</div>
      <h1 class="page-title">I&D Quiz</h1>
      <p class="page-sub">Qui connaît le mieux les mariés ?</p>
    </div>
    <hr class="gold-rule">
    <div class="card">
      <div class="field">
        <label for="input-prenom">Votre prénom</label>
        <input type="text" id="input-prenom" placeholder="Ex : Marie" maxlength="24" autocomplete="off">
      </div>
      <div class="field">
        <label>Votre table</label>
        <div class="tables-grid" id="tables-grid"></div>
      </div>
      <button class="btn btn-primary btn-block" id="btn-register" style="margin-top:20px" disabled>
        ✈ Je suis prêt(e) !
      </button>
    </div>
    <p style="text-align:center;font-size:12px;color:rgba(43,38,32,0.4);margin-top:24px">I&D QUIZ · Mission Paradis</p>
  </div>
</div>

<!-- QUESTION -->
<div id="screen-game" class="hidden">
  <div class="game-header">
    <div class="q-number" id="q-number">Affirmation 1 / 15</div>
    <div class="timer-wrap">
      <svg width="56" height="56" viewBox="0 0 48 48">
        <circle class="timer-track" cx="24" cy="24" r="22"/>
        <circle class="timer-bar" id="timer-bar" cx="24" cy="24" r="22"/>
      </svg>
      <div class="timer-text" id="timer-text">30</div>
    </div>
  </div>
  <div class="q-text" id="q-text"></div>
  <div class="answer-buttons">
    <button class="btn-vrai" id="btn-vrai">
      <span class="btn-icon">✅</span>VRAI
    </button>
    <button class="btn-faux" id="btn-faux">
      <span class="btn-icon">❌</span>FAUX
    </button>
  </div>
</div>

<!-- RÉSULTAT -->
<div id="screen-result" class="hidden">
  <div class="result-badge" id="result-badge">✅ VRAI</div>
  <div class="result-icon" id="result-icon"></div>
  <div class="result-label" id="result-label"></div>
  <div class="result-comment" id="result-comment"></div>
  <div class="result-points" id="result-points"></div>
  <div class="result-pts-label" id="result-pts-label"></div>
  <div class="result-total" id="result-total"></div>
  <button class="btn btn-primary btn-block" id="btn-next-question">
    Affirmation suivante →
  </button>
</div>

<!-- FIN -->
<div id="screen-end" class="hidden">
  <div class="end-icon">🏆</div>
  <div class="end-title">Bravo !</div>
  <hr class="gold-rule" style="width:120px;margin:8px auto 16px">
  <div class="end-score-wrap">
    <div class="end-score" id="end-score">0</div>
    <div class="end-score-label">points · bonnes réponses</div>
  </div>
  <p style="font-family:var(--display-font);font-size:17px;color:rgba(43,38,32,0.65);line-height:1.6">
    Regardez l'écran pour découvrir<br>le classement final ! 🎯
  </p>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
